name: Bump Version and Create PR

on:
  workflow_dispatch:
    inputs:
      BUMP_TYPE:
        description: "Select the bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned via .nvmrc rather than '24.x': this job runs `npm ci`, which
      # fails when the lockfile was generated by a different npm than the one
      # bundled with the Node release that '24.x' happens to resolve to.
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install modules
        run: |
          npm ci --prefix enabler
          npm version --prefix enabler ${{ inputs.BUMP_TYPE }}

          npm ci --prefix processor
          npm version --prefix processor ${{ inputs.BUMP_TYPE }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version"
          branch: "bump-version-branch"
          title: "Bump version"
          body: "This PR bumps the version. This is executed by a GitHub Action `bump.yaml`."
          labels: "version bump"
          sign-commits: true
